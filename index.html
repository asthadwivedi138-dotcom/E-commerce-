<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShopEasy - Demo Store</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1 class="logo">🛍️ ShopEasy</h1>
    <button id="cart-toggle" class="cart-btn" aria-label="Open cart">
      🛒 Cart <span id="cart-count" class="badge">0</span>
    </button>
  </header>

  <section class="toolbar">
    <input id="search" type="search" placeholder="Search products..." aria-label="Search products" />
    <select id="category" aria-label="Filter by category">
      <option value="all">All categories</option>
    </select>
    <select id="sort" aria-label="Sort products">
      <option value="default">Sort: Featured</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="name">Name: A to Z</option>
    </select>
  </section>

  <main>
    <div id="products" class="grid"></div>
    <p id="empty" class="empty" hidden>No products found.</p>
  </main>

  <aside id="cart" class="cart" aria-label="Shopping cart" hidden>
    <div class="cart-head">
      <h2>Your Cart</h2>
      <button id="cart-close" aria-label="Close cart">✕</button>
    </div>
    <div id="cart-items" class="cart-items"></div>
    <div class="cart-foot">
      <div class="total-row"><span>Total</span><strong id="cart-total">₹0</strong></div>
      <button id="checkout" class="primary">Checkout</button>
      <button id="clear-cart" class="link">Clear cart</button>
    </div>
  </aside>
  <div id="overlay" class="overlay" hidden></div>

  <footer class="footer">Demo store. No real payments are processed.</footer>

  <script src="script.js"></script>
</body>
</html>
